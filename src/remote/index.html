<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>AAPlayer Remote</title>
  <link rel="stylesheet" href="/remote.css">
</head>
<body>
  <main id="login" hidden>
    <div class="logo">AA</div>
    <h1>AAPlayer Remote</h1>
    <p>Enter the PIN shown in AAPlayer under View › Add Interface › Web Remote.</p>
    <form id="login-form">
      <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" placeholder="••••••" required>
      <button type="submit">Connect</button>
    </form>
    <p id="login-error" class="error"></p>
  </main>

  <main id="remote" hidden>
    <header>
      <div class="logo small">AA</div>
      <div class="now"><div id="title">Nothing playing</div><div id="sub"></div></div>
    </header>
    <section class="seek">
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Position">
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </section>
    <section class="transport">
      <button data-cmd="prev" aria-label="Previous">⏮</button>
      <button data-cmd="jump" data-arg="-10" aria-label="Back 10 seconds">−10</button>
      <button data-cmd="toggle-play" id="play" class="big" aria-label="Play or pause">▶</button>
      <button data-cmd="jump" data-arg="10" aria-label="Forward 10 seconds">+10</button>
      <button data-cmd="next" aria-label="Next">⏭</button>
    </section>
    <section class="row">
      <button data-cmd="stop">Stop</button>
      <button data-cmd="mute-toggle" id="mute">Mute</button>
      <button data-cmd="fullscreen-toggle">Fullscreen</button>
    </section>
    <section class="volume">
      <span>Volume</span>
      <input id="volume" type="range" min="0" max="200" value="100" aria-label="Volume">
      <span id="vol-text">100%</span>
    </section>
    <h2>Playlist</h2>
    <ol id="playlist"></ol>
  </main>
  <script src="/remote.js"></script>
</body>
</html>
